[tool.poetry]
name = "transcriptomics_data_service"
version = "2.0.0"
description = "A REST API data service for transcriptomics data."
authors = ["Victor Rocheleau <victor.rocheleau@mcgill.ca>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12.0,<3.14"
fastapi = {extras = ["all"], version = "^0.135.3"}
pydantic = "^2.6.1"
bento-lib = {extras = ["fastapi"], version = "^15.0.0"}
jsonschema = "^4.21.1"
pydantic-settings = "^2.1.0"
asyncpg = "^0.31.0"
pandas = "^2.3.3"
joblib = "^1.4.2"

[tool.poetry.group.dev.dependencies]
aioresponses = "^0.7.6"
coverage = "^7.11.0"
debugpy = "^1.8.17"
httpx = "^0.28.1"
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
tox = "^4.31.0"
fasta-checksum-utils = "^0.5.0"
ruff = "^0.15.10"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Linting and formating using Ruff
[tool.ruff]
line-length = 120

[tool.coverage.run]
omit = ["transcriptomics_data_service/export-openapi.py"]
